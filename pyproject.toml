[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qamm"
version = "0.1.0"
description = "Queue-aware market making with Bayesian fill probability, Hawkes order flow and RL quoting"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "polars>=0.20",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "numba>=0.57",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
webapp = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
rl = ["gymnasium>=0.29"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["qamm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
